info:
  name: post /api/Auth/register
  type: http
  seq: 1
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/api/Auth/register"
  body:
    type: json
    data: |-
      {
        "nome": "Professor Teste Enum",
        "email": "enum@curso.com",
        "senha": "SenhaForte123!",
        "perfil": 1, 
        "telefone": "88999999999",
        "areaAtuacao": "Matemática"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5249

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/Auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "nome": "",
            "email": "",
            "senha": "",
            "perfil": "Coordenacao"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
