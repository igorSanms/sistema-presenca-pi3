info:
  name: post /api/Auth/login
  type: http
  seq: 2
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/api/Auth/login"
  body:
    type: json
    data: |
      {
        "email": "admin@presenca.com",
        "senha": "SenhaForte123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
            // Salva o token gerado dentro do Environment atual
            bru.setEnvVar("jwt_token", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/Auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "senha": ""
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
