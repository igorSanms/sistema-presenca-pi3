info:
  name: post /api/Auth/professores
  type: http
  seq: 3
  tags:
    - Auth

http:
  method: GET
  url: "{{baseUrl}}/api/Auth/professores"
  body:
    type: json
    data: |-
      {
        "nome": "Professor Teste Enum",
        "email": "enum@curso.com",
        "senha": "SenhaForte123!",
        "perfil": 1, 
        "telefone": "88999999999",
        "areaAtuacao": "Matemática"
      }
  auth:
    type: bearer
    token: "{{jwt_token}}"

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:5249

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/Auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "nome": "",
            "email": "",
            "senha": "",
            "perfil": "Coordenacao"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
