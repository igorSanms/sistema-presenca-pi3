services:
  db:
    image: postgres:16-alpine
    container_name: presenca_postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpassword
      - POSTGRES_DB=presencadb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d presencadb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: presenca_backend
    ports:
      - "5249:5249"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=presencadb;Username=admin;Password=adminpassword
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/sistema-presenca
      dockerfile: Dockerfile
    container_name: presenca_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/sistema-presenca:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=/api
      - BACKEND_URL=http://backend:5249

volumes:
  postgres_data:
