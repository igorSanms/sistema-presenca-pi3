services:
  db:
    image: postgres:16-alpine
    container_name: presenca_postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpassword
      - POSTGRES_DB=presencadb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d presencadb" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
